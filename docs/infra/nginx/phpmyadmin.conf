server {
    listen 80;
    server_name phpmyadmin.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name phpmyadmin.yourdomain.com;

    root /home/phpMyAdmin-5.2.3-all-languages;
    index index.php;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/phpmyadmin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phpmyadmin/privkey.pem;

    access_log /var/log/nginx/phpmyadmin-access.log;
    error_log /var/log/nginx/phpmyadmin-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(setup|libraries|templates|vendor|test|tests)(/|$) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
    }
}
